[tools]
bun = "1.4.5"
node = "26.13.1"

[tasks.install]
description = "Install dependencies from the lockfile"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Start the dev server"
depends = ["install"]
run = "bun run dev"

[tasks.build]
description = "Build the production site"
depends = ["install"]
run = "bun run build"

[tasks.serve]
description = "Preview the production build"
depends = ["build"]
run = "bun run serve"
