name: CI
on:
  push: # only deploy if the push actually makes changes to the app
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch: # allow manual deployments
permissions:
  contents: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: install tools
        uses: jdx/mise-action@v5.2.9
        with:
          version: "2026.9.6"
          install: true
          cache: true

      - name: build
        run: mise run build

      - name: deploy
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: dist
